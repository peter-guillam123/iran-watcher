name: collect

on:
  schedule:
    # Twice daily — morning brief by 7am UK, afternoon brief by 4pm UK.
    # Both runs land on the SAME dated page; the afternoon run regenerates
    # today's brief with whatever's new since the morning. 30-minute lead
    # is generous (the run itself is ~2 minutes) but leaves slack for
    # GitHub Actions queue delays.
    #
    # 05:30 UTC = 06:30 BST (UK summer) / 05:30 GMT (UK winter, an hour
    # earlier than 06:30 UK because GitHub cron does not follow DST).
    - cron: "30 5 * * *"
    # 14:30 UTC = 15:30 BST (UK summer) / 14:30 GMT (UK winter).
    - cron: "30 14 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Sync deps
        run: uv sync --frozen

      - name: Determine edition
        id: edition
        run: |
          # Map cron schedule → edition. Morning run writes to
          # data/{date}-morning.json with a 24h window; evening writes
          # to data/{date}-evening.json with a "since this morning"
          # window so the second briefing is a delta, not a full re-read.
          # workflow_dispatch defaults to morning if before 11:00 UTC
          # else evening (so manual runs land in the most appropriate
          # slot).
          if [ "${{ github.event.schedule }}" = "30 14 * * *" ]; then
            echo "edition=evening" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event.schedule }}" = "30 5 * * *" ]; then
            echo "edition=morning" >> "$GITHUB_OUTPUT"
          else
            hour=$(date -u +%H)
            if [ "$hour" -ge 11 ]; then
              echo "edition=evening" >> "$GITHUB_OUTPUT"
            else
              echo "edition=morning" >> "$GITHUB_OUTPUT"
            fi
          fi

      - name: Collect
        env:
          RELIEFWEB_APPNAME: ${{ secrets.RELIEFWEB_APPNAME }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          EDITION: ${{ steps.edition.outputs.edition }}
        run: uv run python collect.py 1

      - name: Render
        run: uv run python render.py

      - name: Commit
        run: |
          git config user.name 'iran-watcher-bot'
          git config user.email 'iran-watcher-bot@users.noreply.github.com'
          if git diff --quiet; then
            echo "no changes"
            exit 0
          fi
          # Stage + commit BEFORE pulling, otherwise rebase refuses on
          # unstaged changes. Pull-rebase still runs in case a concurrent
          # push landed between checkout and now.
          git add data/ docs/
          git commit -m "Daily run: $(date -u +'%Y-%m-%d %H:%MZ')"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push
