name: collect

on:
  schedule:
    # Twice daily — morning briefing by 7am UK, evening update by 4pm UK.
    # Each is a separate edition file (data/{date}-morning.json,
    # data/{date}-evening.json), neither overwrites the other.
    #
    # Critical to Dan's workflow: he plans his news days around these
    # two deadlines. Missing them costs editorial value.
    #
    # GitHub Actions schedule is best-effort — it can be delayed by
    # 30+ minutes during high load and occasionally skips entirely.
    # On 2026-05-11 the morning primary AND its 20-min backup BOTH
    # silently dropped, leaving Dan without a morning brief. So each
    # edition now has FOUR firings spread over ~75 minutes — primary
    # plus three backups. The workflow checks if today's edition file
    # was written in the last hour and skips the work if so, so
    # extra firings are free when the primary fired on time.
    #
    # Morning slot (target: by 7am UK).
    # 05:30 UTC = 06:30 BST / 05:30 GMT.
    - cron: "30 5 * * *"   # morning primary
    - cron: "50 5 * * *"   # morning backup +20m
    - cron: "15 6 * * *"   # morning backup +45m
    - cron: "45 6 * * *"   # morning backup +1h15m
    # Evening slot (target: by 4pm UK).
    # 14:30 UTC = 15:30 BST / 14:30 GMT.
    - cron: "30 14 * * *"  # evening primary
    - cron: "50 14 * * *"  # evening backup +20m
    - cron: "15 15 * * *"  # evening backup +45m
    - cron: "45 15 * * *"  # evening backup +1h15m
  workflow_dispatch:
  # External trigger path. An outside scheduler (cron-job.org) calls
  # GitHub's POST /repos/.../dispatches with event_type set to one of
  # these values, and this workflow fires regardless of GH's own
  # scheduled-cron reliability. The internal schedule above stays as
  # the primary; this is the parallel safety net.
  repository_dispatch:
    types: [morning_brief, evening_brief]

permissions:
  contents: write

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Sync deps
        run: uv sync --frozen

      - name: Determine edition
        id: edition
        run: |
          # Edition resolution order:
          #   1. repository_dispatch action name (external trigger via
          #      cron-job.org → POST /dispatches with morning_brief or
          #      evening_brief). This is the most reliable signal.
          #   2. Schedule cron expression (internal GH Actions schedule).
          #      All primary + backup crons for a slot map to the same
          #      edition.
          #   3. Fallback: pick by current UTC hour (< 11 → morning,
          #      else evening). Used by workflow_dispatch.
          if [ "${{ github.event_name }}" = "repository_dispatch" ]; then
            case "${{ github.event.action }}" in
              morning_brief)
                echo "edition=morning" >> "$GITHUB_OUTPUT"
                ;;
              evening_brief)
                echo "edition=evening" >> "$GITHUB_OUTPUT"
                ;;
              *)
                echo "Unknown dispatch action: ${{ github.event.action }}" >&2
                exit 1
                ;;
            esac
            exit 0
          fi
          case "${{ github.event.schedule }}" in
            "30 5 * * *"|"50 5 * * *"|"15 6 * * *"|"45 6 * * *")
              echo "edition=morning" >> "$GITHUB_OUTPUT"
              ;;
            "30 14 * * *"|"50 14 * * *"|"15 15 * * *"|"45 15 * * *")
              echo "edition=evening" >> "$GITHUB_OUTPUT"
              ;;
            *)
              hour=$(date -u +%H)
              if [ "$hour" -ge 11 ]; then
                echo "edition=evening" >> "$GITHUB_OUTPUT"
              else
                echo "edition=morning" >> "$GITHUB_OUTPUT"
              fi
              ;;
          esac

      - name: Skip if today's edition is already fresh
        id: skip
        run: |
          # If today's edition file was written in the last hour, the
          # primary cron already fired — the backup should no-op rather
          # than burn API spend regenerating identical content. We still
          # let workflow_dispatch override (skip the skip) so a manual
          # run always actually runs.
          DATE=$(date -u +%Y-%m-%d)
          EDITION="${{ steps.edition.outputs.edition }}"
          FILE="data/${DATE}-${EDITION}.json"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "Manual run — never skip"
            echo "skip=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ -f "$FILE" ]; then
            MTIME_EPOCH=$(stat -c %Y "$FILE")
            NOW=$(date +%s)
            AGE=$((NOW - MTIME_EPOCH))
            if [ "$AGE" -lt 3600 ]; then
              echo "$FILE is ${AGE}s old (< 1h) — primary cron already fired, skipping backup run"
              echo "skip=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi
          echo "skip=false" >> "$GITHUB_OUTPUT"

      - name: Collect
        if: steps.skip.outputs.skip != 'true'
        env:
          RELIEFWEB_APPNAME: ${{ secrets.RELIEFWEB_APPNAME }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          EDITION: ${{ steps.edition.outputs.edition }}
        run: uv run python collect.py 1

      - name: Render
        if: steps.skip.outputs.skip != 'true'
        run: uv run python render.py

      - name: Commit
        if: steps.skip.outputs.skip != 'true'
        run: |
          git config user.name 'iran-watcher-bot'
          git config user.email 'iran-watcher-bot@users.noreply.github.com'
          if git diff --quiet; then
            echo "no changes"
            exit 0
          fi
          # Stage + commit BEFORE pulling, otherwise rebase refuses on
          # unstaged changes. Pull-rebase still runs in case a concurrent
          # push landed between checkout and now.
          git add data/ docs/
          git commit -m "Daily run: $(date -u +'%Y-%m-%d %H:%MZ')"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push
