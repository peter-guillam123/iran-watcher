name: backfill

# Manual trigger only — use this to retro-fit the threads + translation
# pipeline onto existing data files without re-fetching from sources.
# Useful one-shot operation; the daily cron handles everything from here.

on:
  workflow_dispatch:
    inputs:
      targets:
        description: "Specific JSON stems to backfill, space-separated. Empty = all data files."
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: backfill
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Sync deps
        run: uv sync --frozen

      - name: Run backfill
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: uv run python scripts/backfill_synthesis.py ${{ inputs.targets }}

      - name: Render
        run: uv run python render.py

      - name: Commit
        run: |
          git config user.name 'iran-watcher-bot'
          git config user.email 'iran-watcher-bot@users.noreply.github.com'
          if git diff --quiet; then
            echo "no changes"
            exit 0
          fi
          # Stage + commit BEFORE pulling, otherwise rebase refuses on
          # unstaged changes. Pull-rebase still runs in case a concurrent
          # push landed between checkout and now.
          git add data/ docs/
          git commit -m "Backfill synthesis: $(date -u +'%Y-%m-%d %H:%MZ')"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push
